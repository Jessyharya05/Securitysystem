<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bin - Secure File Sharing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-shield-halved"></i> SecureShare</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="inbox.html">Inbox <span class="badge bg-primary" id="inboxBadge">0</span></a></li>
          <li class="nav-item"><a class="nav-link" href="spam.html">Spam</a></li>
          <li class="nav-item"><a class="nav-link" href="starred.html">Starred</a></li>
          <li class="nav-item"><a class="nav-link active" href="bin.html">Bin</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="accountDropdown" data-bs-toggle="dropdown">
              <i class="fa-solid fa-user"></i> Account
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="settings.html"><i class="fa-solid fa-cog"></i> Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="login.html"><i class="fa-solid fa-sign-out-alt"></i> Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2>Bin (Deleted Files)</h2>
    <div id="fileList" class="row g-3"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2023 SecureShare. Protected with AES-256 & RSA Encryption.</p>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="notificationToast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const currentUser = localStorage.getItem("currentUser");
    const allFiles = JSON.parse(localStorage.getItem("allReceivedFiles")) || {};
    let files = allFiles[currentUser] || [];

    function renderFiles() {
      const list = document.getElementById("fileList");
      list.innerHTML = "";
      const deletedFiles = files.filter(f => f.deleted);
      if (deletedFiles.length === 0) {
        list.innerHTML = "<p>No deleted files.</p>";
      } else {
        deletedFiles.forEach((f, i) => {
          const col = document.createElement("div");
          col.className = "col-md-4";
          col.innerHTML = `
            <div class="card">
              <div class="card-body">
                <h5>${f.name}</h5>
                <p>Received: ${f.time}</p>
                <button class="btn btn-success btn-sm" onclick="restore(${i})">Restore</button>
                <button class="btn btn-danger btn-sm" onclick="permanentDelete(${i})">Delete Permanently</button>
              </div>
            </div>
          `;
          list.appendChild(col);
        });
      }
      updateInboxBadge();
    }

    function restore(i) { 
      files[i].deleted = false; 
      localStorage.setItem("allReceivedFiles", JSON.stringify(allFiles)); 
      showToast("File restored!", "success");
      renderFiles();
    }
    function permanentDelete(i) { 
      files.splice(i, 1); 
      localStorage.setItem("allReceivedFiles", JSON.stringify(allFiles)); 
      showToast("File permanently deleted!", "danger");
      renderFiles();
    }

    function updateInboxBadge() {
      const userFiles = allFiles[currentUser] || [];
      document.getElementById("inboxBadge").innerText = userFiles.filter(f => !f.spam && !f.deleted).length;
    }

    function showToast(message, type = 'info') {
      const toast = new bootstrap.Toast(document.getElementById('notificationToast'));
      document.getElementById('toastMessage').innerText = message;
      toast.show();
    }

    renderFiles();
  </script>
</body>
</html>
