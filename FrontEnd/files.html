<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encrypt & Send File</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar (sama seperti dashboard) -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-shield-halved"></i> SecureShare</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="inbox.html">Inbox <span class="badge bg-primary" id="inboxBadge">0</span></a></li>
          <li class="nav-item"><a class="nav-link" href="spam.html">Spam</a></li>
          <li class="nav-item"><a class="nav-link" href="starred.html">Starred</a></li>
          <li class="nav-item"><a class="nav-link" href="bin.html">Bin</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="accountDropdown" data-bs-toggle="dropdown">
              <i class="fa-solid fa-user"></i> Account
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="settings.html"><i class="fa-solid fa-cog"></i> Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="login.html"><i class="fa-solid fa-sign-out-alt"></i> Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title text-center"><i class="fa-solid fa-file-shield"></i> Encrypt & Send File</h2>
            <form id="uploadForm">
              <div class="mb-3">
                <label for="fileInput" class="form-label">Choose File</label>
                <input type="file" class="form-control" id="fileInput" required>
              </div>
              <div class="mb-3">
                <label for="receiverUsername" class="form-label">Receiver Username</label>
                <input type="text" class="form-control" id="receiverUsername" placeholder="Enter username" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Encrypt & Send</button>
            </form>
            <div id="statusMsg" class="mt-3 text-center"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2023 SecureShare. Protected with AES-256 & RSA Encryption.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("uploadForm").addEventListener("submit", function(e) {
      e.preventDefault();
      encryptAndSend();
    });

    function encryptAndSend() {
      const file = document.getElementById("fileInput").files[0];
      const username = document.getElementById("receiverUsername").value;
      const statusMsg = document.getElementById("statusMsg");

      if (!file || !username) {
        showToast("Please choose a file and enter receiver username!", "danger");
        return;
      }

      // Cek apakah username ada (demo: asumsikan ada jika disimpan)
      const allUsers = JSON.parse(localStorage.getItem("allUsers")) || {};
      if (!allUsers[username]) {
        showToast("Username not found!", "danger");
        return;
      }

      statusMsg.innerHTML = "🔐 Encrypting file with AES-256...";
      setTimeout(() => {
        statusMsg.innerHTML = "🔑 Encrypting AES key with RSA...";
        setTimeout(() => {
          statusMsg.innerHTML = `✅ ${file.name} successfully sent to <b>${username}</b>`;
          showToast("File sent successfully!", "success");

          // Simpan ke received files berdasarkan username
          const allFiles = JSON.parse(localStorage.getItem("allReceivedFiles")) || {};
          if (!allFiles[username]) allFiles[username] = [];
          allFiles[username].push({ name: file.name, time: new Date().toLocaleString(), starred: false, spam: false, deleted: false });
          localStorage.setItem("allReceivedFiles", JSON.stringify(allFiles));

          // Notifikasi: Update badge di navbar (jika halaman terbuka)
          updateInboxBadge();
        }, 1200);
      }, 1200);
    }

    function updateInboxBadge() {
      const currentUser = localStorage.getItem("currentUser");
      const allFiles = JSON.parse(localStorage.getItem("allReceivedFiles")) || {};
      const userFiles = allFiles[currentUser] || [];
      const badge = document.getElementById("inboxBadge");
      if (badge) badge.innerText = userFiles.filter(f => !f.spam && !f.deleted).length;
    }

    function showToast(message, type = 'info') {
      const toast = new bootstrap.Toast(document.getElementById('notificationToast'));
      document.getElementById('toastMessage').innerText = message;
      toast.show();
    }
  </script>
</body>
</html>
