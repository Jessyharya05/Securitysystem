<script>
  const API_URL = 'http://localhost/Securitysystem/Backend/api';

  function checkAuth() {


    const sessionToken = localStorage.getItem('session_token');
    if (!sessionToken) {
      window.location.href = 'login.html';
      return null;
    }
    return sessionToken;
  }

   // Tambahkan di bagian atas setelah checkAuth()
async function debugCryptoSetup() {
  console.log('🔍 Debugging Crypto Setup...');
  
  const privateKey = localStorage.getItem('user_private_key');
  const publicKey = localStorage.getItem('user_public_key');
  const sessionToken = localStorage.getItem('session_token');
  
  console.log('Session token exists:', !!sessionToken);
  console.log('Private key exists:', !!privateKey);
  console.log('Public key exists:', !!publicKey);
  
  if (privateKey) {
    console.log('Private key preview:', privateKey.substring(0, 80));
    console.log('Private key length:', privateKey.length);
  }
  
  // Test private key format
  if (privateKey && privateKey.includes('-----BEGIN PRIVATE KEY-----')) {
    console.log('✅ Private key has correct PEM format');
  } else {
    console.warn('⚠️ Private key may be in wrong format');
  }
}

// Panggil saat load
window.addEventListener('DOMContentLoaded', () => {
  checkAuth();
  debugCryptoSetup(); // Tambahkan ini
  loadSharedFiles();
});

  // Load shared files from backend
  async function loadSharedFiles() {
  const sessionToken = checkAuth();
  if (!sessionToken) return;

  const loadingState = document.getElementById('loadingState');
  const fileList = document.getElementById('fileList');

  loadingState.style.display = 'block';
  fileList.innerHTML = '';

  try {
    const response = await fetch(`${API_URL}/files.php`, {
      headers: {
        'Authorization': sessionToken
      }
    });

    const data = await response.json();

    loadingState.style.display = 'none';

    if (data.success && data.shared_with_me && data.shared_with_me.length > 0) {
      // Filter out spam AND permanently deleted files
      const spamFiles = JSON.parse(localStorage.getItem('spam_files') || '[]');
      const deletedSpam = JSON.parse(localStorage.getItem('deleted_spam') || '[]');
      
      const filteredFiles = data.shared_with_me.filter(file => 
        !spamFiles.includes(file.id) && !deletedSpam.includes(file.id)
      );

      if (filteredFiles.length > 0) {
        renderFiles(filteredFiles);
        updateInboxBadge(filteredFiles.length);
      } else {
        fileList.innerHTML = `
          <div class="col-12">
            <div class="card">
              <div class="card-body text-center py-5">
                <i class="fa-solid fa-inbox fa-4x text-muted mb-3"></i>
                <h4>No Shared Files</h4>
                <p class="text-muted">No files in inbox. Check Spam folder.</p>
              </div>
            </div>
          </div>
        `;
        updateInboxBadge(0);
      }
    } else {
      fileList.innerHTML = `
        <div class="col-12">
          <div class="card">
            <div class="card-body text-center py-5">
              <i class="fa-solid fa-inbox fa-4x text-muted mb-3"></i>
              <h4>No Shared Files</h4>
              <p class="text-muted">No files have been shared with you yet.</p>
            </div>
          </div>
        </div>
      `;
      updateInboxBadge(0);
    }

  } catch (error) {
    console.error('Load files error:', error);
    loadingState.style.display = 'none';
    fileList.innerHTML = `
      <div class="col-12">
        <div class="alert alert-danger">
          <i class="fa-solid fa-exclamation-triangle"></i> Error loading files. Please refresh the page.
        </div>
      </div>
    `;
  }
}

  // Render files
  function renderFiles(files) {
    const fileList = document.getElementById('fileList');
    fileList.innerHTML = '';

    files.forEach(file => {
      const col = document.createElement('div');
      col.className = 'col-md-6 col-lg-4';
      
      const shareDate = new Date(file.share_date).toLocaleDateString();
      const canDownload = file.can_download;
      const expired = file.expires_at && new Date(file.expires_at) < new Date();

      col.innerHTML = `
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">
              <i class="fa-solid fa-file"></i> ${file.original_filename}
            </h5>
            <p class="card-text">
              <small class="text-muted">
                <strong>From:</strong> ${file.owner_username}<br>
                <strong>Shared:</strong> ${shareDate}<br>
                <strong>Size:</strong> ${formatFileSize(file.file_size)}
                ${file.expires_at ? `<br><strong>Expires:</strong> ${new Date(file.expires_at).toLocaleDateString()}` : ''}
              </small>
            </p>
            ${expired ? '<span class="badge bg-danger">Expired</span>' : ''}
          </div>
          <div class="card-footer bg-transparent">
            <div class="btn-group w-100" role="group">
              <button class="btn btn-sm btn-success" 
                      onclick="downloadFile(${file.id}, '${file.original_filename}')"
                      ${!canDownload || expired ? 'disabled' : ''}>
                <i class="fa-solid fa-download"></i> Download
              </button>
              <button class="btn btn-sm btn-warning" onclick="toggleStar(${file.id})">
                <i class="fa-solid fa-star"></i>
              </button>
              <button class="btn btn-sm btn-danger" onclick="markAsSpam(${file.id})">
                <i class="fa-solid fa-flag"></i> Spam
              </button>
            </div>
          </div>
        </div>
      `;
      
      fileList.appendChild(col);
    });
  }

    console.log('📦 Full response:', data);

        } catch (decryptError) {

          return;
        }

// Bagian RECIPIENT di fungsi downloadFile
} else {
  // ✅ RECIPIENT: Decrypt RSA-encrypted AES key first
  console.log('📨 I am a recipient - decrypting with RSA');
  showToast("Decrypting file...", "info");

  const userPrivateKey = localStorage.getItem('user_private_key');
  
  if (!userPrivateKey) {
    showToast("Cannot decrypt: Private key not found. Please upload a file first to generate keys.", "danger");
    return;
  }

  try {
    // ✅ INI YANG BENAR: Buat object dengan struktur yang benar
    const fileDataForDecrypt = {
      content: data.file_data.encrypted_content,     // encrypted file content
      encrypted_key: data.file_data.encrypted_key,   // RSA-encrypted AES key
      is_owner: false                                 // false = recipient
    };
    
    console.log('📦 File data for decrypt:', {
      contentLength: fileDataForDecrypt.content?.length,
      keyLength: fileDataForDecrypt.encrypted_key?.length,
      isOwner: fileDataForDecrypt.is_owner
    });
    
    const decryptedData = await decryptFileFromDownload(fileDataForDecrypt);
    finalBlob = new Blob([decryptedData]);
    console.log('✅ Recipient decryption successful!');
    
  } catch (decryptError) {
    console.error('❌ Decryption failed:', decryptError);
    
    console.log('🔍 Decryption debug info:');
    console.log('- Private key exists:', !!localStorage.getItem('user_private_key'));
    console.log('- Encrypted key exists:', !!data.file_data.encrypted_key);
    console.log('- Encrypted content exists:', !!data.file_data.encrypted_content);
    
    if (decryptError.name === 'OperationError') {
      if (confirm("Decryption failed. Request re-share?")) {
        await requestReshare(fileId);
      } else {
        showToast("Decryption failed.", "danger");
      }
    } else {
      showToast("Decryption failed: " + decryptError.message, "danger");
    }
    return;
  }
}

    } else {
      // File is not encrypted
      console.log('📄 File is not encrypted');
      const fileContent = base64ToArrayBuffer(data.file_data.encrypted_content);
      finalBlob = new Blob([fileContent]);
    }

    // Step 3: Download
    const url = window.URL.createObjectURL(finalBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);

    showToast("File downloaded successfully!", "success");

  } catch (error) {
    console.error('❌ Download error:', error);
    showToast("Download failed: " + error.message, "danger");

}

// Fungsi untuk request re-share
async function requestReshare(fileId) {
  try {
    const sessionToken = localStorage.getItem('session_token');
    
    const response = await fetch(`${API_URL}/share.php`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': sessionToken
      },
      body: JSON.stringify({
        action: 'reshare',
        file_id: fileId
      })
    });
    
    const data = await response.json();
    
    if (data.success) {
      showToast("✅ Re-share requested. Please try downloading again in a moment.", "success");
    } else {
      showToast("❌ Failed to request re-share: " + data.error, "danger");
    }
  } catch (error) {
    console.error("Error requesting re-share:", error);
    showToast("Error requesting re-share", "danger");
  }
}

// Helper function (keep your existing one, or use this)
function base64ToArrayBuffer(base64) {
  const binary = window.atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}
  // Toggle star
  function toggleStar(fileId) {
    const starred = JSON.parse(localStorage.getItem('starred_files') || '[]');
    const index = starred.indexOf(fileId);
    
    if (index > -1) {
      starred.splice(index, 1);
      showToast("Removed from starred", "info");
    } else {
      starred.push(fileId);
      showToast("Added to starred!", "success");
    }
    
    localStorage.setItem('starred_files', JSON.stringify(starred));
  }

  // Mark as spam
  function markAsSpam(fileId) {
    if (!confirm("Mark this file as spam?")) return;
    
    const spam = JSON.parse(localStorage.getItem('spam_files') || '[]');
    
    // Add to spam if not already there
    if (!spam.includes(fileId)) {
      spam.push(fileId);
      localStorage.setItem('spam_files', JSON.stringify(spam));
    }
    
    showToast("Marked as spam", "warning");
    
    // Reload inbox to hide the spam file
    loadSharedFiles();
  }

  // Format file size
  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
    return (bytes / 1048576).toFixed(2) + ' MB';
  }

  // Update inbox badge
  function updateInboxBadge(count) {
    const badge = document.getElementById('inboxBadge');
    if (badge) badge.innerText = count;
  }

  // Logout
  async function logout() {
    const sessionToken = localStorage.getItem('session_token');
    
    if (sessionToken) {
      try {
        await fetch(`${API_URL}/logout.php`, {
          method: 'POST',
          headers: { 'Authorization': sessionToken }
        });
      } catch (error) {
        console.error('Logout error:', error);
      }
    }
    
    localStorage.removeItem('session_token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
  }

  // Show toast
  function showToast(message, type = 'info') {
    const toast = new bootstrap.Toast(document.getElementById('notificationToast'));
    document.getElementById('toastMessage').innerText = message;
    toast.show();
  }

  // Load files on page load
  window.addEventListener('DOMContentLoaded', () => {
    checkAuth();
    loadSharedFiles();
  });

};
