<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Secure File Sharing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="js/crypto.js"></script>  <!-- ✅ ADD THIS -->
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4" style="width: 100%; max-width: 400px;">
      <div class="card-body text-center">
        <i class="fa-solid fa-shield-halved fa-3x text-primary mb-3"></i>
        <h2>Secure File Sharing</h2>
        <form id="loginForm">
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Username" required>
          </div>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Password" required>
          </div>
          <div id="errorMsg" class="text-danger mb-3" style="display: none;"></div>
          <button type="submit" class="btn btn-primary w-100" id="loginBtn">Login Securely</button>
        </form>
        <div class="mt-3">
          Don't have an account? <a href="register.html" class="text-primary">Register here</a>
        </div>
        <div class="mt-3 text-muted">
          Protected with AES-256 & RSA Encryption
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="notificationToast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = 'http://localhost/Securitysystem/Backend/api';
    
    const loginBtn = document.getElementById("loginBtn");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const errorMsg = document.getElementById("errorMsg");

    function showError(msg) {
      errorMsg.style.display = "block";
      errorMsg.innerText = msg;
    }

    function hideError() {
      errorMsg.style.display = "none";
    }

    function showToast(message, type = 'info') {
      const toast = new bootstrap.Toast(document.getElementById('notificationToast'));
      document.getElementById('toastMessage').innerText = message;
      toast.show();
    }

    async function login() {
      hideError();
      
      // Validation
      if (username.value === "" || password.value === "") {
        showError("Username and password are required!");
        return;
      }

      // Disable button and show loading
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

      try {
        // Call backend API
        const response = await fetch(`${API_URL}/login.php`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: username.value,
            password: password.value
          })
        });

        const data = await response.json();

        if (data.success) {
          // Store session token and user info
          localStorage.setItem('session_token', `Bearer ${data.session_token}`);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          showToast('Login successful!', 'success');
          
          
          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
          
        } else {
          // Show error from backend
          showError(data.message || 'Login failed');
          loginBtn.disabled = false;
          loginBtn.innerHTML = 'Login Securely';
        }

      } catch (error) {
        console.error('Login error:', error);
        showError('Connection error. Please check if backend is running.');
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Login Securely';
      }
    }

    // Form submit handler
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      login();
    });

    // Check if already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const sessionToken = localStorage.getItem('session_token');
      if (sessionToken) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
