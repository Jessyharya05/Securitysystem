<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Secure File Sharing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4" style="width: 100%; max-width: 400px;">
      <div class="card-body text-center">
        <i class="fa-solid fa-user-plus fa-3x text-primary mb-3"></i>
        <h2>Create Secure Account</h2>
        <form id="registerForm">
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Username" required>
          </div>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="Email" required>
          </div>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Password" required>
          </div>
          <div class="mb-3">
            <div class="progress" style="height: 6px;">
              <div id="strengthBar" class="progress-bar" style="width: 0%;"></div>
            </div>
            <small class="text-muted">Must contain: Uppercase, lowercase, number, symbol, min 8 chars</small>
          </div>
          <div id="errorMsg" class="text-danger mb-3" style="display: none;"></div>
          <div id="statusMsg" class="text-info mb-3" style="display: none;"></div>
          <button type="submit" class="btn btn-primary w-100" id="registerBtn">
            <i class="fa-solid fa-lock"></i> Register Securely
          </button>
        </form>
        <div class="mt-3">
          <a href="login.html" class="text-decoration-none">Already have an account? Login</a>
        </div>
        <div class="mt-3 text-muted">
          <small>🔐 AES-256 & RSA-2048 Encryption</small>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="notificationToast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- ✅ LOAD CRYPTO MODULE -->
  <script src="js/crypto.js"></script>
  
  <script>
    const API_URL = 'http://localhost/Securitysystem/Backend/api';
    
    const username = document.getElementById("username");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const errorMsg = document.getElementById("errorMsg");
    const statusMsg = document.getElementById("statusMsg");
    const strengthBar = document.getElementById("strengthBar");
    const registerBtn = document.getElementById("registerBtn");

    const strongRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

    // Password strength indicator
    password.addEventListener("input", () => {
      let val = password.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[a-z]/.test(val)) score++;
      if (/\d/.test(val)) score++;
      if (/[\W_]/.test(val)) score++;
      
      let width = score * 20;
      strengthBar.style.width = width + "%";
      
      if (score <= 2) strengthBar.className = "progress-bar bg-danger";
      else if (score <= 4) strengthBar.className = "progress-bar bg-warning";
      else strengthBar.className = "progress-bar bg-success";
    });

    function showError(msg) {
      errorMsg.style.display = "block";
      errorMsg.innerText = msg;
      statusMsg.style.display = "none";
    }

    function showStatus(msg) {
      statusMsg.style.display = "block";
      statusMsg.innerText = msg;
      errorMsg.style.display = "none";
    }

    function hideMessages() {
      errorMsg.style.display = "none";
      statusMsg.style.display = "none";
    }

    // ✅ REGISTER WITH RSA KEYPAIR GENERATION
    async function register() {
      hideMessages();

      // Validate inputs
      if (username.value === "" || email.value === "" || password.value === "") {
        showError("All fields are required!");
        return;
      }

      if (!strongRegex.test(password.value)) {
        showError("Password is not strong enough!");
        return;
      }

      registerBtn.disabled = true;
      registerBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating keys...';
      showStatus("🔐 Generating RSA keypair (2048-bit)...");

      try {
        // ✅ STEP 1: Generate RSA keypair (2048-bit)
        const { publicKey, privateKey } = await generateRSAKeyPair();
        
        showStatus("📤 Registering account...");

        // ✅ STEP 2: Send registration to backend WITH public key
        const response = await fetch(`${API_URL}/register.php`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: username.value,
            email: email.value,
            password: password.value,
            public_key: publicKey  // ✅ Send public key to backend
          })
        });

        const data = await response.json();

        if (data.success) {
          // ✅ STEP 3: Store private key in browser localStorage
         localStorage.setItem('user_private_key', privateKey);
          localStorage.setItem('user_public_key', publicKey);
          
          showToast("✅ Registration successful! Keys generated.", "success");
          showStatus("✅ Account created! Redirecting to login...");
          
          setTimeout(() => {
            window.location.href = "login.html";
          }, 2000);
        } else {
          showError(data.message || "Registration failed");
          registerBtn.disabled = false;
          registerBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Register Securely';
        }

      } catch (error) {
        console.error("Registration error:", error);
        showError("Registration failed: " + error.message);
        registerBtn.disabled = false;
        registerBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Register Securely';
      }
    }

    document.getElementById("registerForm").addEventListener("submit", (e) => {
      e.preventDefault();
      register();
    });

    function showToast(message, type = 'info') {
      const toast = new bootstrap.Toast(document.getElementById('notificationToast'));
      document.getElementById('toastMessage').innerText = message;
      toast.show();
    }
  </script>
</body>
</html>
