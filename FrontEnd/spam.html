<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spam - Secure File Sharing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-shield-halved"></i> SecureShare</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="inbox.html">Inbox <span class="badge bg-primary" id="inboxBadge">0</span></a></li>
          <li class="nav-item"><a class="nav-link active" href="spam.html">Spam</a></li>
          <li class="nav-item"><a class="nav-link" href="starred.html">Starred</a></li>
          <li class="nav-item"><a class="nav-link" href="bin.html">Bin</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="accountDropdown" data-bs-toggle="dropdown">
              <i class="fa-solid fa-user"></i> Account
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="settings.html"><i class="fa-solid fa-cog"></i> Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" onclick="logout(); return false;">
                <i class="fa-solid fa-sign-out-alt"></i> Logout
              </a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2><i class="fa-solid fa-flag"></i> Spam Files</h2>
    <p class="text-muted">Files marked as spam</p>
    <div id="fileList" class="row g-3"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2023 SecureShare. Protected with AES-256 & RSA Encryption.</p>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="notificationToast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_URL = 'http://localhost/Securitysystem/Backend/api';

  function checkAuth() {
    const sessionToken = localStorage.getItem('session_token');
    if (!sessionToken) {
      window.location.href = 'login.html';
      return null;
    }
    return sessionToken;
  }

  async function loadSpamFiles() {
    const sessionToken = checkAuth();
    if (!sessionToken) return;

    const fileList = document.getElementById('fileList');
    const spamFiles = JSON.parse(localStorage.getItem('spam_files') || '[]');
    const deletedSpam = JSON.parse(localStorage.getItem('deleted_spam') || '[]');
    
    if (spamFiles.length === 0) {
      fileList.innerHTML = '<p class="text-muted">No spam files.</p>';
      return;
    }

    try {
      const response = await fetch(`${API_URL}/files.php`, {
        headers: { 'Authorization': sessionToken }
      });

      const data = await response.json();

      if (data.success && data.shared_with_me) {
        // Filter: only spam files that are NOT permanently deleted
        const spam = data.shared_with_me.filter(file => 
          spamFiles.includes(file.id) && !deletedSpam.includes(file.id)
        );

        if (spam.length === 0) {
          fileList.innerHTML = '<p class="text-muted">No spam files.</p>';
          return;
        }

        fileList.innerHTML = spam.map(file => `
          <div class="col-md-4">
            <div class="card">
              <div class="card-body">
                <h5><i class="fa-solid fa-flag text-danger"></i> ${file.original_filename}</h5>
                <p class="text-muted">From: ${file.owner_username}</p>
                <p class="text-muted">Size: ${formatFileSize(file.file_size)}</p>
                <button class="btn btn-success btn-sm" onclick="unmarkSpam(${file.id})">
                  <i class="fa-solid fa-check"></i> Not Spam
                </button>
                <button class="btn btn-danger btn-sm" onclick="deleteSpam(${file.id})">
                  <i class="fa-solid fa-trash"></i> Delete
                </button>
              </div>
            </div>
          </div>
        `).join('');
      }
    } catch (error) {
      console.error('Error loading spam files:', error);
      fileList.innerHTML = '<p class="text-danger">Error loading files</p>';
    }
  }

  function unmarkSpam(fileId) {
    const spam = JSON.parse(localStorage.getItem('spam_files') || '[]');
    const index = spam.indexOf(fileId);
    
    if (index > -1) {
      spam.splice(index, 1);
      localStorage.setItem('spam_files', JSON.stringify(spam));
      showToast("Removed from spam - File restored to inbox", "success");
      loadSpamFiles();
    }
  }

  function deleteSpam(fileId) {
    if (!confirm("Delete this file permanently? It will be hidden from all folders.")) return;
    
    // Remove from spam list
    const spam = JSON.parse(localStorage.getItem('spam_files') || '[]');
    const spamIndex = spam.indexOf(fileId);
    if (spamIndex > -1) {
      spam.splice(spamIndex, 1);
      localStorage.setItem('spam_files', JSON.stringify(spam));
    }
    
    // Add to permanent delete list
    const deletedSpam = JSON.parse(localStorage.getItem('deleted_spam') || '[]');
    if (!deletedSpam.includes(fileId)) {
      deletedSpam.push(fileId);
      localStorage.setItem('deleted_spam', JSON.stringify(deletedSpam));
    }
    
    showToast("File deleted permanently", "success");
    loadSpamFiles();
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
    return (bytes / 1048576).toFixed(2) + ' MB';
  }

  async function updateInboxBadge() {
    const sessionToken = checkAuth();
    if (!sessionToken) return;

    try {
      const response = await fetch(`${API_URL}/files.php`, {
        headers: { 'Authorization': sessionToken }
      });
      const data = await response.json();
      
      if (data.success) {
        // Badge shows inbox count (non-spam, non-deleted)
        const spamFiles = JSON.parse(localStorage.getItem('spam_files') || '[]');
        const deletedSpam = JSON.parse(localStorage.getItem('deleted_spam') || '[]');
        const inboxCount = data.shared_with_me.filter(file => 
          !spamFiles.includes(file.id) && !deletedSpam.includes(file.id)
        ).length;
        
        const badge = document.getElementById('inboxBadge');
        if (badge) badge.innerText = inboxCount;
      }
    } catch (error) {
      console.error('Error:', error);
    }
  }

  async function logout() {
    const sessionToken = localStorage.getItem('session_token');
    if (sessionToken) {
      try {
        await fetch(`${API_URL}/logout.php`, {
          method: 'POST',
          headers: { 'Authorization': sessionToken }
        });
      } catch (error) {
        console.error('Logout error:', error);
      }
    }
    localStorage.removeItem('session_token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
  }

  function showToast(message, type = 'info') {
    const toast = new bootstrap.Toast(document.getElementById('notificationToast'));
    document.getElementById('toastMessage').innerText = message;
    toast.show();
  }

  window.addEventListener('DOMContentLoaded', () => {
    checkAuth();
    loadSpamFiles();
    updateInboxBadge();
  });
</script>
</body>
</html>
