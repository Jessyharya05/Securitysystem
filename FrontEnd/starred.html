<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starred - Secure File Sharing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-shield-halved"></i> SecureShare</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="inbox.html">Inbox <span class="badge bg-primary" id="inboxBadge">0</span></a></li>
          <li class="nav-item"><a class="nav-link" href="spam.html">Spam</a></li>
          <li class="nav-item"><a class="nav-link active" href="starred.html">Starred</a></li>
          <li class="nav-item"><a class="nav-link" href="bin.html">Bin</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="accountDropdown" data-bs-toggle="dropdown">
              <i class="fa-solid fa-user"></i> Account
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="settings.html"><i class="fa-solid fa-cog"></i> Settings</a></li>
           <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" onclick="logout(); return false;">
  <i class="fa-solid fa-sign-out-alt"></i> Logout
  </a></li>
</ul>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2>Starred Files</h2>
    <div id="fileList" class="row g-3"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2023 SecureShare. Protected with AES-256 & RSA Encryption.</p>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="notificationToast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_URL = 'http://localhost/Securitysystem/Backend/api';

  // Check authentication
  function checkAuth() {
    const sessionToken = localStorage.getItem('session_token');
    if (!sessionToken) {
      window.location.href = 'login.html';
      return null;
    }
    return sessionToken;
  }

  // Update inbox badge
  async function updateInboxBadge() {
    const sessionToken = checkAuth();
    if (!sessionToken) return;

    try {
      const response = await fetch(`${API_URL}/files.php`, {
        headers: { 'Authorization': sessionToken }
      });
      
      const data = await response.json();
      
      if (data.success) {
        const spamFiles = JSON.parse(localStorage.getItem('spam_files') || '[]');
        const deletedSpam = JSON.parse(localStorage.getItem('deleted_spam') || '[]');
        
        const inboxCount = data.shared_with_me.filter(file => 
          !spamFiles.includes(file.id) && !deletedSpam.includes(file.id)
        ).length;
        
        const badge = document.getElementById('inboxBadge');
        if (badge) badge.innerText = inboxCount;
      }
    } catch (error) {
      console.error('Error:', error);
    }
  }

  // Load starred files
  async function loadStarredFiles() {
    const sessionToken = checkAuth();
    if (!sessionToken) return;

    const fileList = document.getElementById('fileList');
    const starredFiles = JSON.parse(localStorage.getItem('starred_files') || '[]');
    
    if (starredFiles.length === 0) {
      fileList.innerHTML = '<p class="text-muted">No starred files.</p>';
      return;
    }

    try {
      const response = await fetch(`${API_URL}/files.php`, {
        headers: { 'Authorization': sessionToken }
      });

      const data = await response.json();

      if (data.success && data.shared_with_me) {
        const starred = data.shared_with_me.filter(file => starredFiles.includes(file.id));

        if (starred.length === 0) {
          fileList.innerHTML = '<p class="text-muted">No starred files.</p>';
          return;
        }

        fileList.innerHTML = starred.map(file => `
          <div class="col-md-4">
            <div class="card">
              <div class="card-body">
                <h5><i class="fa-solid fa-star text-warning"></i> ${file.original_filename}</h5>
                <p class="text-muted">From: ${file.owner_username}</p>
                <p class="text-muted">Size: ${formatFileSize(file.file_size)}</p>
                <button class="btn btn-success btn-sm" onclick="downloadFile(${file.id}, '${file.original_filename}')">
                  <i class="fa-solid fa-download"></i> Download
                </button>
                <button class="btn btn-warning btn-sm" onclick="toggleStar(${file.id})">
                  <i class="fa-solid fa-star"></i> Unstar
                </button>
              </div>
            </div>
          </div>
        `).join('');
      }
    } catch (error) {
      console.error('Error:', error);
      fileList.innerHTML = '<p class="text-danger">Error loading files</p>';
    }
  }

  // Download, toggleStar, formatFileSize, logout, showToast functions
  async function downloadFile(fileId, filename) {
    const sessionToken = checkAuth();
    if (!sessionToken) return;
    try {
      const response = await fetch(`${API_URL}/download.php?file_id=${fileId}`, {
        headers: { 'Authorization': sessionToken }
      });
      if (response.ok) {
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        showToast("File downloaded!", "success");
      } else {
        showToast("Download failed", "danger");
      }
    } catch (error) {
      showToast("Download failed", "danger");
    }
  }

  function toggleStar(fileId) {
    const starred = JSON.parse(localStorage.getItem('starred_files') || '[]');
    const index = starred.indexOf(fileId);
    if (index > -1) {
      starred.splice(index, 1);
      showToast("Removed from starred", "info");
    } else {
      starred.push(fileId);
      showToast("Added to starred!", "success");
    }
    localStorage.setItem('starred_files', JSON.stringify(starred));
    loadStarredFiles();
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
    return (bytes / 1048576).toFixed(2) + ' MB';
  }

  async function logout() {
    const sessionToken = localStorage.getItem('session_token');
    if (sessionToken) {
      try {
        await fetch(`${API_URL}/logout.php`, {
          method: 'POST',
          headers: { 'Authorization': sessionToken }
        });
      } catch (error) {
        console.error('Logout error:', error);
      }
    }
    localStorage.removeItem('session_token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
  }

  function showToast(message, type = 'info') {
    const toast = new bootstrap.Toast(document.getElementById('notificationToast'));
    document.getElementById('toastMessage').innerText = message;
    toast.show();
  }

  window.addEventListener('DOMContentLoaded', () => {
    checkAuth();
    loadStarredFiles();
    updateInboxBadge();
  });
</script>
</body>
</html>
